<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tank Defender 8</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="cabinet" aria-label="Tank Defender 8">
        <canvas id="game" width="256" height="240" aria-label="Tank Defender 8 playfield"></canvas>
      </section>
      <nav class="toolbar" aria-label="Game actions">
        <button type="button" data-action="one">1P</button>
        <button type="button" data-action="two">2P</button>
        <button type="button" data-action="prev">-</button>
        <button type="button" data-action="next">+</button>
        <button type="button" data-action="edit">EDIT</button>
        <button type="button" data-action="test">TEST</button>
        <button type="button" data-action="save">SAVE</button>
        <button type="button" data-action="load">LOAD</button>
        <button type="button" data-action="clear">CLEAR</button>
        <button type="button" data-action="export">EXPORT</button>
        <button type="button" data-action="import">IMPORT</button>
        <button type="button" data-action="pause">PAUSE</button>
        <button type="button" data-action="reset">RESET</button>
        <input id="stage-pack-file" class="visually-hidden" type="file" accept="application/json,.json">
      </nav>
    </main>
    <script src="src/core/geometry.js"></script>
    <script src="src/core/frame-counter.js"></script>
    <script src="src/core/battle-random.js"></script>
    <script src="src/core/directions.js"></script>
    <script src="src/rules/enemy-ai-rules.js"></script>
    <script src="src/rules/enemy-spawn-rules.js"></script>
    <script src="src/entities/enemy-state.js"></script>
    <script src="src/entities/player-state.js"></script>
    <script src="src/entities/power-up-state.js"></script>
    <script src="src/rules/power-up-collection-rules.js"></script>
    <script src="src/rules/power-up-effect-rules.js"></script>
    <script src="src/rules/power-up-spawn-rules.js"></script>
    <script src="src/entities/projectile-state.js"></script>
    <script src="src/rules/projectile-collision-rules.js"></script>
    <script src="src/rules/projectile-impact-rules.js"></script>
    <script src="src/entities/transient-effect-state.js"></script>
    <script src="src/rules/score-rules.js"></script>
    <script src="src/rules/stage-result-rules.js"></script>
    <script src="src/rules/tank-collision-rules.js"></script>
    <script src="src/config/value-normalization.js"></script>
    <script src="src/config/game-session-settings.js"></script>
    <script src="src/config/combat-settings.js"></script>
    <script src="src/config/enemy-ai-settings.js"></script>
    <script src="src/config/enemy-spawn-settings.js"></script>
    <script src="src/config/explosion-settings.js"></script>
    <script src="src/config/player-movement-settings.js"></script>
    <script src="src/config/power-up-settings.js"></script>
    <script src="src/config/timing-settings.js"></script>
    <script src="src/presentation/tank-presentation.js"></script>
    <script src="src/presentation/effect-presentation.js"></script>
    <script src="src/config/stage-flow-settings.js"></script>
    <script src="src/config/enemy-types.js"></script>
    <script src="src/config/player-upgrades.js"></script>
    <script src="src/stages/stage-grid.js"></script>
    <script src="src/rules/terrain-collision-rules.js"></script>
    <script src="src/rules/wall-damage-rules.js"></script>
    <script src="src/config/stage-settings.js"></script>
    <script src="src/stages/stage-pack.js"></script>
    <script src="src/stages/stage-routing.js"></script>
    <script src="src/stages/enemy-sequences.js"></script>
    <script src="src/game.js"></script>
  </body>
</html>
